<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.teo.LaptopCooling"/></policy>
  <policy context="default">
    <allow send_destination="org.teo.LaptopCooling" send_interface="org.teo.LaptopCooling" send_member="GetStatus"/>
    <allow send_destination="org.teo.LaptopCooling" send_interface="org.teo.LaptopCooling" send_member="SetMode"/>
    <allow send_destination="org.teo.LaptopCooling" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.teo.LaptopCooling" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
